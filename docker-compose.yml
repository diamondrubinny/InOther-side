# Local development dependencies only. Not a production deployment.
services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: inother
      POSTGRES_PASSWORD: inother_dev   # dev only
      POSTGRES_DB: inother_dev
    ports: ["127.0.0.1:5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U inother -d inother_dev"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7.4-alpine
    ports: ["127.0.0.1:6379:6379"]

  # ClamAV daemon. First start downloads signatures (several minutes, ~300MB).
  # StreamMaxLength must cover the largest allowed upload (video: 2GB).
  clamav:
    image: clamav/clamav:1.4
    environment:
      CLAMD_CONF_StreamMaxLength: 2100M
    ports: ["127.0.0.1:3310:3310"]

  # Catches outgoing email in development: UI at http://localhost:8025
  mailpit:
    image: axllent/mailpit:v1.27
    ports: ["127.0.0.1:1025:1025", "127.0.0.1:8025:8025"]

volumes:
  pgdata:
