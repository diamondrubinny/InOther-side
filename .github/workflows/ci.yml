name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: inother
          POSTGRES_PASSWORD: inother_dev
          POSTGRES_DB: inother_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U inother -d inother_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7.4-alpine
        ports: ["6379:6379"]
    env:
      TEST_DATABASE_URL: postgres://inother:inother_dev@localhost:5432/inother_test
      TEST_REDIS_URL: redis://127.0.0.1:6379/15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --audit-level=moderate
      - run: pnpm --filter @inother/shared build
      - run: pnpm -r typecheck
      - run: pnpm -r test
      - run: pnpm -r build

  e2e:
    runs-on: ubuntu-latest
    needs: test
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: inother
          POSTGRES_PASSWORD: inother_dev
          POSTGRES_DB: inother_e2e
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U inother -d inother_e2e"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7.4-alpine
        ports: ["6379:6379"]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @inother/shared build && pnpm --filter @inother/api build
      - run: pnpm --filter @inother/web exec playwright install --with-deps chromium
      - run: pnpm --filter @inother/web e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: apps/web/test-results
