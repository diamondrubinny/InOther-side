name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: inother
          POSTGRES_PASSWORD: inother_dev
          POSTGRES_DB: inother_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U inother -d inother_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://inother:inother_dev@localhost:5432/inother_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --audit-level=moderate
      - run: pnpm --filter @inother/shared build
      - run: pnpm -r typecheck
      - run: pnpm -r test
      - run: pnpm -r build
